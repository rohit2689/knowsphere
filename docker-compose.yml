name: knowsphere

x-api: &api
  image: knowsphere-api:latest
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 5

x-api-env: &api-env
  PORT: "3000"
  DATABASE_URL: postgresql://postgres:pass@postgres:5432/knowsphere
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-123456}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
  TRUST_PROXY: "1"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: knowsphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowsphere"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: knowsphere-api:latest
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:pass@postgres:5432/knowsphere
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api1:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api1
    ports:
      - "3001:3000"

  api2:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api2

  api3:
    <<: *api
    environment:
      <<: *api-env
      INSTANCE_ID: api3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy

volumes:
  pgdata: